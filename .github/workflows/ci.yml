name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / JDK ${{ matrix.java }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
            java: "11"
          - os: ubuntu-latest
            python: "3.13"
            java: "11"
          - os: ubuntu-latest
            python: "3.13"
            java: "21"
          - os: macos-latest
            python: "3.13"
            java: "21"
          - os: windows-latest
            python: "3.13"
            java: "21"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  offline-benchmarks:
    name: Offline benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run network-free benchmarks
        run: python3 benchmarks/run_offline.py --json-output benchmark-results.json
      - name: Upload benchmark summary
        uses: actions/upload-artifact@v4
        with:
          name: offline-benchmark-results
          path: benchmark-results.json
          if-no-files-found: error

  quality:
    name: Packaging and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
      - name: Install build tools
        run: python -m pip install build coverage ruff twine
      - name: Lint sources and tests
        run: python -m ruff check src tests
      - name: Byte-compile sources and tests
        run: python -m compileall -q src tests
      - name: Report test coverage
        run: |
          PYTHONPATH=src python -m coverage run --branch -m unittest discover -s tests
          python -m coverage report --show-missing
          python -m coverage xml -o coverage.xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Test installed wheel
        shell: bash
        run: |
          set -euo pipefail

          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          if [[ ${#wheels[@]} -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "expected exactly one wheel in dist/" >&2
            exit 1
          fi

          venv="$RUNNER_TEMP/repomin-wheel-venv"
          run_dir="$RUNNER_TEMP/repomin-wheel-tests"
          python -m venv "$venv"
          mkdir "$run_dir"
          "$venv/bin/python" -m pip install --no-cache-dir "${wheels[0]}"

          cd "$run_dir"
          "$venv/bin/repomin" --help >/dev/null
          "$venv/bin/python" -I - <<'PY'
          from pathlib import Path
          import sys

          import repomin

          package_path = Path(repomin.__file__).resolve()
          environment_path = Path(sys.prefix).resolve()
          try:
              package_path.relative_to(environment_path)
          except ValueError:
              raise SystemExit(
                  f"repomin imported outside isolated environment: {package_path}"
              )
          print(f"testing installed package at {package_path}")
          PY
          "$venv/bin/python" -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -v
      - name: Test installed source distribution
        shell: bash
        run: |
          set -euo pipefail

          sdists=("$GITHUB_WORKSPACE"/dist/*.tar.gz)
          if [[ ${#sdists[@]} -ne 1 || ! -f "${sdists[0]}" ]]; then
            echo "expected exactly one source distribution in dist/" >&2
            exit 1
          fi

          venv="$RUNNER_TEMP/repomin-sdist-venv"
          run_dir="$RUNNER_TEMP/repomin-sdist-tests"
          python -m venv "$venv"
          mkdir "$run_dir"
          "$venv/bin/python" -m pip install --no-cache-dir "${sdists[0]}"

          cd "$run_dir"
          "$venv/bin/repomin" --help >/dev/null
          "$venv/bin/python" -I - <<'PY'
          from pathlib import Path
          import sys

          import repomin

          package_path = Path(repomin.__file__).resolve()
          environment_path = Path(sys.prefix).resolve()
          try:
              package_path.relative_to(environment_path)
          except ValueError:
              raise SystemExit(
                  f"repomin imported outside isolated environment: {package_path}"
              )
          print(f"testing installed package at {package_path}")
          PY
          "$venv/bin/python" -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -v
